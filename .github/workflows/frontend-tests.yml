name: Frontend Tests

on:
  workflow_call:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./frontend
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci --legacy-peer-deps
    
    - name: Run linter
      run: npm run lint

    - name: Build verification
      run: npm run build

    - name: Run unit tests
      run: npm run test -- --run --coverage
    
    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./frontend/coverage/coverage-final.json
        flags: frontend-unit
        name: codecov-frontend
        fail_ci_if_error: false
    
    - name: Archive coverage results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-frontend
        path: frontend/coverage/
        retention-days: 30

  e2e-tests:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./frontend
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci --legacy-peer-deps
    
    - name: Install Playwright browsers
      run: npx playwright install --with-deps
    
    - name: Run E2E tests
      run: npm run test:e2e -- --timeout=120000
      env:
        CI: true
        # Run against the deployed production app — no local build/serve and no
        # Firebase web config needed (the deployed app already has it baked in).
        E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
        # Test-account credentials (the specs self-skip if these are absent, e.g. on forks).
        E2E_STUDENT_EMAIL: ${{ secrets.E2E_STUDENT_EMAIL }}
        E2E_STUDENT_PASSWORD: ${{ secrets.E2E_STUDENT_PASSWORD }}
        E2E_TEACHER_EMAIL: ${{ secrets.E2E_TEACHER_EMAIL }}
        E2E_TEACHER_PASSWORD: ${{ secrets.E2E_TEACHER_PASSWORD }}
    
    - name: Upload Playwright report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: frontend/playwright-report/
        retention-days: 30
    
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: e2e-test-results
        path: frontend/test-results/
        retention-days: 30
