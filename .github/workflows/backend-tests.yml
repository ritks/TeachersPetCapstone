name: Backend Tests

on:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./backend
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: teacherspet_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio pytest-cov
    
    - name: Run tests with pytest
      run: |
        python -m pytest tests/ -v --tb=short --cov=. --cov-report=xml --cov-report=html --cov-fail-under=80
      env:
        # Tests read TEST_DATABASE_URL (never DATABASE_URL) so they only ever
        # touch this disposable CI Postgres, never a real database.
        TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/teacherspet_test
        GEMINI_API_KEY: mock-gemini-api-key-for-ci-testing
    
    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./backend/coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
    
    - name: Archive test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: pytest-results
        path: backend/.pytest_cache/
        retention-days: 30
